<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock</title>

<style type="text/css">
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
}

body {
    font-family: Helvetica, Arial, sans-serif;
    text-align: center;
}

#clock {
    position: absolute;
    top: 50%;
    width: 100%;
    margin-top: -60px;
}

#time {
    font-size: 90px;
    font-weight: bold;
    line-height: 100px;
    letter-spacing: 2px;
}

#date {
    margin-top: 15px;
    font-size: 20px;
    color: #999;
}
</style>

<script type="text/javascript">

function clock() {
    var d = new Date();

    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();

    if (h < 10) h = "0" + h;
    if (m < 10) m = "0" + m;
    if (s < 10) s = "0" + s;

    document.getElementById("time").innerHTML =
        h + ":" + m + ":" + s;

    document.getElementById("date").innerHTML =
        d.getFullYear() + "." +
        (d.getMonth() + 1) + "." +
        d.getDate();
}

window.onload = function() {
    clock();
    setInterval(clock, 1000);
};

</script>

</head>

<body>

<div id="clock">
    <div id="time">00:00:00</div>
    <div id="date">0000.0.0</div>
</div>

</body>
</html>
